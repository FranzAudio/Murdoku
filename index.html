<!doctype html>
<html lang="en" data-build="1.1.2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12151B" />
    <title>Murdoku</title>
    <link rel="stylesheet" href="styles.css?v=1.1.2" />
    <script defer src="engine.js?v=1.1.2"></script>
    <script defer src="game.js?v=1.1.2"></script>
    <script defer src="strings.js?v=1.1.2"></script>
    <script defer src="reliability.js?v=1.1.2"></script>
    <script defer src="app.js?v=1.1.2"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="brand">
        <span class="manor" aria-hidden="true">♜</span>
        <div>
          <p id="manor-tagline" class="eyebrow">BLACKWOOD MANOR · EST. 1886</p>
          <h1>Murdoku</h1>
          <p id="subtitle"></p>
        </div>
      </div>
      <div class="header-controls">
        <div
          id="size-selector"
          class="size-selector"
          role="radiogroup"
          aria-label="Dimensione griglia"
        >
          <button
            type="button"
            role="radio"
            aria-checked="false"
            data-size="5"
            tabindex="-1"
          >
            5×5
          </button>
          <button
            type="button"
            role="radio"
            aria-checked="true"
            data-size="6"
            tabindex="0"
          >
            6×6
          </button>
          <button
            type="button"
            role="radio"
            aria-checked="false"
            data-size="7"
            tabindex="-1"
          >
            7×7
          </button>
        </div>
        <label class="language"
          ><span id="language-label">Language</span
          ><select id="language" aria-label="Language">
            <option value="en" selected>English</option>
            <option value="es">Español</option>
            <option value="ca">Català</option>
            <option value="it">Italiano</option>
          </select></label
        >
      </div>
    </header>
    <main>
      <nav id="toolbar" class="toolbar" aria-label="Game controls">
        <button id="new" class="primary">
          <img src="assets/icons/new-case.png?v=1.1.2" alt="" /><span></span>
        </button>
        <button id="undo" disabled>
          <img src="assets/icons/undo.png?v=1.1.2" alt="" /><span></span>
        </button>
        <button id="reset" disabled>
          <img src="assets/icons/reset.png?v=1.1.2" alt="" /><span></span>
        </button>
        <button id="mark" disabled aria-pressed="false">
          <img src="assets/icons/mark-x.png?v=1.1.2" alt="" /><span></span>
        </button>
        <button id="hint" disabled aria-keyshortcuts="h">
          <img src="assets/icons/hint.png?v=1.1.2" alt="" /><span
            id="hint-label"
          ></span>
        </button>
        <button id="check" disabled>
          <img src="assets/icons/check.png?v=1.1.2" alt="" /><span></span>
        </button>
      </nav>
      <div class="case-bar">
        <span id="case-label"></span><span id="counter"></span>
      </div>
      <div id="feedback" role="status" aria-live="polite"></div>
      <div
        id="conflicts"
        class="sr-only"
        role="alert"
        aria-live="assertive"
      ></div>
      <section
        id="hint-banner"
        class="hint-banner"
        role="region"
        aria-live="polite"
        hidden
      >
        <div class="hint-header">
          <div class="hint-title-group">
            <img
              src="assets/icons/hint.png?v=1.1.2"
              class="hint-mini-icon"
              alt=""
            /><span id="hint-eyebrow"></span
            ><span id="hint-step" class="hint-step-badge"></span>
          </div>
          <button id="hint-dismiss" type="button">✕</button>
        </div>
        <p id="hint-text"></p>
        <div class="hint-footer">
          <button id="hint-clue-link"></button
          ><button id="hint-return" hidden></button
          ><span id="hint-subtext"></span>
        </div>
      </section>
      <div id="reset-confirm" class="confirmation" hidden>
        <p id="reset-question"></p>
        <button id="confirm-reset"></button><button id="cancel-reset"></button>
      </div>
      <nav class="view-tabs" aria-label="View">
        <button id="board-tab" aria-pressed="true"></button
        ><button id="clues-tab" aria-pressed="false"></button>
      </nav>
      <div class="game-layout">
        <section id="board-panel" class="board-panel">
          <div class="board-wrap">
            <div
              id="board"
              class="board"
              role="grid"
              aria-label="Murdoku"
            ></div>
            <div id="welcome" class="welcome">
              <p class="eyebrow">VILLA BLACKWOOD</p>
              <h2 id="welcome-title"></h2>
              <p id="welcome-text"></p>
              <button id="start" class="primary"></button>
            </div>
          </div>
          <section class="tray-section">
            <h2 id="tray-title"></h2>
            <div
              id="tray"
              class="tray"
              role="listbox"
              aria-label="People"
            ></div>
          </section>
          <p id="instructions" class="instructions"></p>
        </section>
        <aside id="dossier">
          <div class="dossier-heading">
            <p class="eyebrow" id="dossier-label"></p>
            <h2 id="clues-title"></h2>
            <button
              id="toggle-dossier"
              aria-expanded="true"
              aria-controls="clues"
            ></button>
          </div>
          <p id="rules" class="rules"></p>
          <div class="filters">
            <button data-filter="all" aria-pressed="true"></button
            ><button data-filter="room" aria-pressed="false"></button
            ><button data-filter="position" aria-pressed="false"></button
            ><button data-filter="object" aria-pressed="false"></button>
          </div>
          <div id="clues"></div>
          <section class="room-key">
            <h3 id="rooms-title"></h3>
            <div id="legend"></div>
            <h3 id="furniture-title"></h3>
            <div id="furniture-legend"></div>
          </section>
        </aside>
      </div>
      <footer>
        <span>MURDOKU</span
        ><span id="footer-copy"> · <span id="build-id"></span></span>
      </footer>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-symbol" aria-hidden="true">⌕</div>
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <p id="modal-detail"></p>
      <div class="modal-actions">
        <button id="modal-primary" class="primary"></button
        ><button id="modal-close"></button>
      </div>
    </dialog>
    <noscript>Enable JavaScript to play.</noscript>
  </body>
</html>
